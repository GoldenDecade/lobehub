name: WQ Branch Sync & Docker Build

on:
  schedule:
    # 每天北京时间早上 06:00 (UTC 22:00) 自动同步官方 canary 并构建 wq 镜像
    - cron: '0 22 * * *'
  push:
    branches:
      - wq
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: '构建前是否先合并官方 lobehub/lobehub 的 canary 分支'
        required: false
        default: true
        type: boolean

concurrency:
  group: wq-docker-build
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: goldendecade/lobehub

jobs:
  sync-and-build:
    name: Sync upstream/canary & Build wq image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wq branch
        uses: actions/checkout@v4
        with:
          ref: wq
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge latest upstream/canary into wq
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_upstream == true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/lobehub/lobehub.git || true
          git fetch upstream canary
          if git merge --no-edit upstream/canary; then
            git push origin HEAD:wq
          else
            echo "::error::自动合并 upstream/canary 存在代码冲突，请在本地执行 git fetch upstream canary && git merge upstream/canary 手动解决冲突后推送。"
            git merge --abort || true
            exit 1
          fi

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SHA=${{ steps.vars.outputs.sha_short }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:wq
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:wq-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

