# 放到 /etc/nginx/conf.d/lobehub.conf
# 单域名方案：对外只需 https://lobe.85718571.xyz 一个域名（走 Cloudflare Tunnel -> 127.0.0.1:80，同时兼容 443 直连）。
# 采用与 astrbot.conf / openconnector.conf 一致的单 server 块同时监听 80/443，避免 Cloudflare Tunnel / Flexible SSL 下 80->443 重定向循环。

upstream lobehub_app {
    server 127.0.0.1:3210;
    keepalive 16;
}

upstream lobehub_agent_gw {
    server 127.0.0.1:9989;
    keepalive 16;
}

upstream lobehub_device_gw {
    server 127.0.0.1:8788;
    keepalive 16;
}

upstream lobehub_s3 {
    server 127.0.0.1:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lobe.85718571.xyz;

    ssl_certificate     /etc/letsencrypt/live/lobe.85718571.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lobe.85718571.xyz/privkey.pem;

    client_max_body_size 100m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 1. Agent Gateway（WebSocket 流式对话网关，剥离 /agent-gw 前缀转发到 127.0.0.1:9989）
    location ^~ /agent-gw/ {
        proxy_pass http://lobehub_agent_gw/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 2. Device Gateway（本地电脑 lh connect / Claude Code 网关，剥离 /device-gw 前缀转发到 127.0.0.1:8788）
    location ^~ /device-gw/ {
        proxy_pass http://lobehub_device_gw/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 3. RustFS S3 对象存储（S3_ENABLE_PATH_STYLE=1 且桶名为 lobe，保留 /lobe/ 前缀与 Host 签名一致）
    location ^~ /lobe/ {
        client_max_body_size 200m;
        proxy_pass http://lobehub_s3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
    }

    # 4. LobeHub 主站应用
    location / {
        proxy_pass http://lobehub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
